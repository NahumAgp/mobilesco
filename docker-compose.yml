services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mobilesco_network
    restart: unless-stopped

  backend:
    build: ./mobilesco-back
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - db
    networks:
      - mobilesco_network
    restart: unless-stopped

  frontend:
    build: ./mobilesco-front
    ports:
      - "80:80"
      - "443:443"  # IMPORTANTE: Puerto para HTTPS
    volumes:
      # Certificados SSL (desde el servidor)
      - /etc/letsencrypt/live/mobilesco.cloud/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/mobilesco.cloud/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      # Configuración de nginx (el archivo que creamos)
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - mobilesco_network
    restart: unless-stopped

networks:
  mobilesco_network:
    driver: bridge

volumes:
  mysql_data: