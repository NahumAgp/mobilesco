version: "3.9"

services:

  db:
    image: mysql:8.0
    container_name: mobilesco_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobilesco
      MYSQL_USER: mobilesco
      MYSQL_PASSWORD: mobilesco123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./mobilesco-back
    container_name: mobilesco_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mobilesco
      SPRING_DATASOURCE_USERNAME: mobilesco
      SPRING_DATASOURCE_PASSWORD: mobilesco123

  frontend:
    build: ./mobilesco-front
    container_name: mobilesco_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
