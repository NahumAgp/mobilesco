services:
  db:
    image: mysql:8.0
    container_name: mobilesco-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - mobilesco_network_dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./mobilesco-back
    container_name: mobilesco-backend-dev
    ports:
      - "8081:8081"
    env_file:
      - .env.dev   # 👈 IMPORTANTE
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads   # 👈 CLAVE PARA IMÁGENES
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mobilesco_network_dev
    restart: unless-stopped

  frontend:
    build: ./mobilesco-front
    container_name: mobilesco-frontend-dev
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081
    depends_on:
      - backend
    networks:
      - mobilesco_network_dev
    restart: unless-stopped

networks:
  mobilesco_network_dev:
    driver: bridge

volumes:
  mysql_data_dev: